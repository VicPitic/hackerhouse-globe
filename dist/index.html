<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hackerhouse Map</title>
    <script type="module" crossorigin src="/assets/index-BCg7YXL5.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-R018xXun.css">
  </head>
  <body>
    <section id="globeViz" aria-label="Hackerhouse globe"></section>

    <div class="ui-top-left">
      <p class="logo">Hackerhouse Map</p>
      <input
        id="searchInput"
        type="search"
        placeholder="Search city, house or focus"
        autocomplete="off"
      />
    </div>

    <aside id="houseDetails" class="house-details" aria-live="polite" aria-label="Selected hackerhouse details">
      <div id="houseDetailsEmpty" class="house-details-empty">
        <p class="house-details-label">Discover</p>
        <h2>Select a Hacker House</h2>
        <p>Click any marker to view its title, bio, and quick info.</p>
      </div>

      <article id="houseDetailsCard" class="house-details-card" hidden>
        <div class="house-details-head">
          <p id="houseRegion" class="house-region"></p>
          <button id="houseDetailsClose" type="button" class="house-details-close" aria-label="Close details">
            Close
          </button>
        </div>
        <div class="house-title-row">
          <img id="houseTitleFavicon" class="house-title-favicon" alt="" aria-hidden="true" hidden />
          <h2 id="houseTitle"></h2>
        </div>
        <p id="houseLocation" class="house-location"></p>
        <p id="houseBio" class="house-bio"></p>

        <dl class="house-meta">
          <div>
            <dt>Focus</dt>
            <dd id="houseFocus"></dd>
          </div>
          <div>
            <dt>Status</dt>
            <dd id="houseStatus"></dd>
          </div>
        </dl>

        <div class="house-marker-customizer">
          <label for="markerModelSelect" class="house-marker-label">Map Marker</label>
          <select id="markerModelSelect" class="house-marker-select" aria-label="Choose marker model"></select>
        </div>

        <a id="houseVisitSite" class="house-visit-site" href="#" target="_blank" rel="noopener noreferrer">Visit Site</a>
      </article>
    </aside>

    <a
      class="github-star-button"
      href="https://github.com/VicPitic/hackerhouse-globe"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Star hackerhouse-globe on GitHub"
      title="Star on GitHub"
    >
      <svg class="github-star-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 2l2.8 5.68 6.26.91-4.53 4.42 1.07 6.24L12 16.33 6.4 19.25l1.07-6.24L2.94 8.59l6.26-.91L12 2z" />
      </svg>
    </a>

    <p class="credit"><a href="https://vic.ceo" target="_blank" rel="noopener noreferrer" style="color: inherit; text-decoration: none;">Made by Vic Giurgiu</a></p>

  </body>
</html>
